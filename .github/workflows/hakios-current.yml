name: Pinned HakiOS kernel for Sweet bringup
on:
  push:
    branches: [codex/hakios-refresh-20261029]
    paths: [.github/workflows/hakios-current.yml, ports/sweet/patch-current-kernel.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reviewed upstream revision
        run: |
          git init upstream-current
          git -C upstream-current fetch --depth 1 https://github.com/oosexgang/hakios-xnu-kernel.git 88513176b1e96ecf0b764cd62c6f4e6ac71345e3
          git -C upstream-current checkout --detach FETCH_HEAD
          test "$(git -C upstream-current rev-parse HEAD)" = 88513176b1e96ecf0b764cd62c6f4e6ac71345e3
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld flex bison autoconf automake libtool libncurses-dev uuid-dev python3-venv meson ninja-build libz-dev
          bash ports/sweet/setup-toolchain.sh
      - name: Build reviewed upstream kernel
        env:
          THEOS: ${{ github.workspace }}/.theos
        run: |
          mkdir -p out/hakios-current
          python3 ports/sweet/patch-current-kernel.py upstream-current
          sha256sum ports/sweet/patch-current-kernel.py > out/hakios-current/SWEET_PATCH.sha256
          cd upstream-current
          xnu/apply.sh
          xnu-deps/setup.sh
          ./xnu-build.sh -j4 build > ../out/hakios-current/build.log 2>&1
          cp xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837 ../out/hakios-current/
          git rev-parse HEAD > ../out/hakios-current/UPSTREAM_COMMIT
          cd ../out/hakios-current
          sha256sum mach.development.bcm2837 > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hakios-current-kernel
          path: out/hakios-current/
