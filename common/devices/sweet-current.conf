NAME="Redmi Note 10 Pro (Sweet current HakiOS bringup)"
KIND=phone
SOC="Qualcomm SM7150 / Snapdragon 732G / Adreno 618"
UEFI_TARGET=sweet
UEFI_FD=out/firmware/SWEET_UEFI.fd
DTB=out/firmware/sweet.dtb
FD_BASE=0x9FC00000
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000
FB_BASE=0x9C000000
WIFI_ATH11K=0
BOOTARGS="sweet=1 gic_vtimer=19 bootcpu=7 gpu=0 gl=1 sweettouch=1 sweetkeys=1 touch_lat=1"
DEFAULT_SECS=900
USERLAND_VARS=""
FIRMWARE="fw-gpu"

# Matched experimental components; original out/kernel and userland/root.apfs stay separate.
export XL_KERNEL=${XL_KERNEL:-out/hakios-20261029/kernel-sweet-input2/mach.development.bcm2837}
export XL_LOADER=${XL_LOADER:-out/hakios-20261029/loader-usb-replies/loader.efi}
export XL_RAMDISK=${XL_RAMDISK:-out/hakios-input-20261029/root.apfs}
